[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spendlens"
version = "0.1.0"
description = "FinOps CLI for AWS on Steampipe/Powerpipe: tag compliance, rightsizing, cost diff, savings and AI Q&A."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
]

[project.optional-dependencies]
ai = ["litellm>=1.40", "sqlglot>=25", "boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5", "pglast>=6"]

[project.scripts]
spendlens = "spendlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spendlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
