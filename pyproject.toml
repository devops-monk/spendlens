[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spendlens"
version = "0.4.2"
description = "FinOps CLI for AWS on Steampipe/Powerpipe: tag compliance, rightsizing, cost diff, savings and AI Q&A."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "markdown-it-py>=2.2",  # ask -o: answers as HTML (already installed with rich)
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
  "boto3>=1.34",  # cost diff --breakdown: read-only ce:GetCostAndUsage (Steampipe cannot group service + tag)
]

[project.optional-dependencies]
ai = ["anthropic>=2.8", "openai>=1.40", "sqlglot>=25"]
dev = ["pytest>=8", "ruff>=0.5", "pglast>=6", "moto[server]>=5", "boto3>=1.34", "spendlens[ai]",
       "markdown>=3.5", "pygments>=2.17"]  # markdown/pygments: scripts/build_site.py

[project.scripts]
spendlens = "spendlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spendlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not system'"
markers = [
  "unit: pure logic, no I/O beyond tmp files",
  "integration: real components wired together (CLI, SQLite, powerpipe), no cloud",
  "system: end-to-end against an AWS emulator (Moto) via isolated Steampipe; needs SPENDLENS_SYSTEM=1",
]

[tool.ruff]
line-length = 110
target-version = "py311"
