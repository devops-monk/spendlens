# Build the spendlens image natively on amd64 and arm64 runners (no QEMU: Steampipe crashes under
# emulation), smoke-test each offline, then publish one multi-arch tag to Docker Hub.
#
# Triggers: a version tag (git tag v0.1.0 && git push origin v0.1.0) or a manual run.
# Needs: repository secret DOCKERHUB_TOKEN (Docker Hub access token, Read & Write).
#        optional repository variable DOCKERHUB_USERNAME (default abhaypratap).
name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'abhaypratap' }}/spendlens

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for ${{ matrix.platform }} (loaded locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: spendlens:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke test (offline, demo data, no credentials)
        run: |
          docker run --rm --network none spendlens:ci --help > /dev/null
          docker run --rm --network none spendlens:ci tags --source demo --summary | tail -1
          docker run --rm --network none spendlens:ci waste --source demo --summary --by service | tail -2
          docker run --rm --network none -e SPENDLENS_STEAMPIPE_SERVICE=on spendlens:ci doctor --offline
          test "$(docker run --rm --entrypoint id spendlens:ci -u)" != "0"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'abhaypratap' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
          echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr / - >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'abhaypratap' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # splitting is intended: one -t per tag, one ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
      - uses: actions/checkout@v4

      - name: Sync the Docker Hub overview from docker/README.dockerhub.md
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'abhaypratap' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: docker/README.dockerhub.md
          short-description: "Read-only FinOps CLI for AWS: tags, rightsizing, waste, cost diff, anomalies, savings and AI Q&A."
