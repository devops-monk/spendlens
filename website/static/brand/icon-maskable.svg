<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 76 76" role="img" aria-label="spendlens">
  <defs>
    <linearGradient id="sl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset=".55" stop-color="#7d5cff"/>
      <stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <radialGradient id="sl-sheen" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="-6" y="-6" width="76" height="76" fill="url(#sl-bg)"/>
  <rect x="-6" y="-6" width="76" height="76" fill="url(#sl-sheen)"/>
  <!-- lens -->
  <circle cx="27.5" cy="27.5" r="15.5" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-width="5"/>
  <!-- falling spend: three bars, tallest first -->
  <rect x="18.6" y="19" width="4.6" height="16.5" rx="1.6" fill="#fff"/>
  <rect x="25.2" y="23.5" width="4.6" height="12" rx="1.6" fill="#fff"/>
  <rect x="31.8" y="28.5" width="4.6" height="7" rx="1.6" fill="#fff"/>
  <!-- handle -->
  <path d="M39.6 39.6 50.5 50.5" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/>
</svg>
