# spendlens product site — spendlens.devops-monk.com
# Additive server block for the SHARED VPS. Matched by server_name only, so it does
# not affect any other site on this box. No `default_server` on purpose.
# certbot --nginx appends the managed `listen 443 ssl` + cert lines and the
# HTTP->HTTPS redirect to THIS block only.

server {
    listen 80;
    listen [::]:80;
    server_name spendlens.devops-monk.com;

    root /var/www/spendlens;
    index index.html;

    # Static site: serve the file, fall back to 404 (no app backend).
    location / {
        try_files $uri $uri/ =404;
    }

    # Assets carry ?v=<version>, so a week of caching is safe.
    location ~* \.(?:png|jpe?g|gif|svg|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Never serve deploy helpers even if they end up under the root.
    location ^~ /deploy/ { deny all; return 404; }

    access_log /var/log/nginx/spendlens.access.log;
    error_log  /var/log/nginx/spendlens.error.log;
}
