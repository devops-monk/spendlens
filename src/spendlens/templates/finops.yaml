# spendlens company FinOps policy
# Every key is optional; anything left out uses the built-in default.

common_dimensions: [account_id, region]
tag_dimensions: []            # e.g. [Environment, "Service Owner"]: extra tag columns in findings

tagging:
  mandatory: [Environment, "Service Owner", CostCentre]
  allowed_values:
    Environment: [prod, staging, dev, test]
  prohibited: [Password, Secret]
  tag_limit: 45
  environment_tag: Environment     # used by environment-aware standards (*_by_env below)

# Rightsizing / waste thresholds (names match the Powerpipe mod variables; `spendlens params --filter sizing`).
# *_by_env maps are matched against the tagging.environment_tag value; "*" applies to everything else.
sizing:
  ec2_allowed_instance_types: ["t3.%", "t4g.%", "m6i.%", "m7g.%", "c6i.%", "c7g.%", "r6i.%", "r7g.%"]
  ec2_cpu_low: 20                       # alarm below this 30-day peak CPU %
  ec2_cpu_high: 35                      # info below this
  ec2_running_instance_age_max_days: 90 # reservation / savings plan candidate
  ec2_stopped_instance_max_days: 30
  ebs_volume_max_size_gb: 100
  ebs_volume_max_iops: 32000
  ebs_snapshot_age_max_days: 90
  rds_allowed_instance_classes: ["db.t3.%", "db.t4g.%", "db.m5.%", "db.m6g.%", "db.m6i.%", "db.r6g.%", "db.r6i.%"]
  rds_avg_connections_min: 2
  rds_cpu_low: 25
  rds_cpu_high: 50
  rds_multi_az_by_env: {prod: true, "*": false}
  rds_performance_insights_by_env: {prod: true, "*": false}
  rds_backup_retention_max_days_by_env: {prod: 14, "*": 1}
  ecs_desired_tasks_by_env: {prod: 3, "*": 1}     # prod tasks must also be spread over that many AZs
  ecs_task_max_vcpu: 0.25
  ecs_task_max_memory_gb: 0.5
  lambda_error_rate_max_pct: 10
  cloudwatch_log_group_retention_max_days: 30
  cloudwatch_log_group_kms_required: true
  secretsmanager_unused_max_days: 90

# Unit prices used for $ savings estimates (approx. us-east-1 on-demand list). Adjust for your region/discounts.
pricing:
  currency: USD
  ebs_gb_month: {gp2: 0.10, gp3: 0.08, io1: 0.125, io2: 0.125, st1: 0.045, sc1: 0.015, standard: 0.05}
  nat_gateway_hour: 0.045
  eip_hour: 0.005
  downsize_saving_pct: 0.5
  reservation_saving_pct: 0.3
  # ec2_hourly: {m5.large: 0.107}       # add/override instance prices for your region

# spendlens cost diff | trend | showback | resources
cost:
  metric: net_unblended          # unblended | net_unblended | amortized | net_amortized | blended
  exclude_record_types: [Credit, Refund]
  default_group_by: service      # service | account | region | usage-type | instance-type | operation | tag:<Key>
  change_alarm_abs: 10           # flag a change when |change| >= this ...
  change_alarm_pct: 20           # ... and |change %| >= this (new/removed groups need only the absolute amount)
  trend_months: 6
  showback_tag_keys: [Service Owner, Environment]

# spendlens anomalies: daily cost per group vs trailing baseline (robust z-score)
anomaly:
  lookback_days: 30
  detect_days: 3
  threshold: 3.0
  min_daily_cost: 1.0
  min_increase: 10             # ignore spikes smaller than this per day
  include_drops: false
  group_by: service            # service | account | region | usage-type | tag:<Key>

# spendlens savings: Cost Optimization Hub + commitment (Savings Plans / RI) coverage
savings:
  commitment_coverage_target_pct: 70
  commitment_min_on_demand: 100
  savings_plan_expiration_warning_days: 45

# spendlens dashboard / --format html. Brand colours are used for chrome only (header, accents);
# chart data colours are a fixed colour-blind-safe palette. Replace with your brand guidelines' values.
dashboard:
  title: spendlens FinOps report
  organisation: ""
  brand_primary: "#E6007E"       # accent (placeholder: confirm against brand guidelines)
  brand_ink: "#000000"           # header background
  brand_on_ink: "#FFFFFF"
  # font_family: '"Your Brand Sans", system-ui, sans-serif'

budgets:
  monthly_total: null          # e.g. 25000 -- checked by `spendlens forecast` (AWS Budgets are read too)
  warn_pct: 80                 # forecast above this % of a budget = at risk
  per_tag: {}                  # e.g. {Team: {payments: 5000, search: 3000}}

llm:
  # provider: openai | azure | bedrock | anthropic | openai_compatible
  provider: bedrock            # bedrock uses the AWS role assumed in your terminal
  model: anthropic.claude-sonnet-5-5
  # base_url: http://localhost:11434/v1   # openai_compatible (Ollama, vLLM, LM Studio ...) / azure endpoint
  # api_key_env: OPENAI_API_KEY           # NAME of the env var holding the key, never the key itself
  # api_version: 2024-10-21               # azure only
  # region: eu-west-1                     # bedrock only
  max_rows: 500
  query_timeout_s: 60

notifications:
  slack_webhook_env: SPENDLENS_SLACK_WEBHOOK
  teams_webhook_env: SPENDLENS_TEAMS_WEBHOOK

steampipe:
  host: localhost
  port: 9193
  connection: aws              # or your aggregator, e.g. aws_all
  # dsn: postgresql://steampipe:pw@localhost:9193/steampipe

powerpipe:
  max_parallel: 10
  timeout_s: 1800

history:
  enabled: true                # every live run is saved for trends and `spendlens history diff`
  # path: .spendlens/history.db   # CI: restore/save this file between pipeline runs (S3 or cache)
  keep_runs: 200

aws:
  profile: null                # null = use whatever is assumed in the terminal
  accounts: []
  regions: []
