# spendlens scheduled FinOps run for GitHub Actions (generated by `spendlens init --ci github`).
# Save as .github/workflows/spendlens.yml.
#
# One-time setup (details: docs/ci.md):
#   1. AWS: an IAM OIDC identity provider for token.actions.githubusercontent.com and a read-only role
#      (docs/permissions.md) trusting this repository. No AWS keys are stored in GitHub.
#   2. Repository variables: AWS_ROLE_ARN, AWS_REGION; optional SPENDLENS_HISTORY_S3 (s3://bucket/path/history.db).
#      Secrets (optional): SPENDLENS_SLACK_WEBHOOK, SPENDLENS_TEAMS_WEBHOOK.
#   3. Commit your finops.yaml.

name: spendlens

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for the AWS role
  contents: read

concurrency: spendlens  # never two runs writing the history at once

env:
  SPENDLENS_PACKAGE: "spendlens[ai] @ git+https://github.com/devops-monk/spendlens.git"  # pin a tag in production
  SPENDLENS_CONFIG: ${{ github.workspace }}/finops.yaml
  SPENDLENS__HISTORY__PATH: ${{ github.workspace }}/.spendlens/history.db
  SPENDLENS_HISTORY_S3: ${{ vars.SPENDLENS_HISTORY_S3 }}
  STEAMPIPE_UPDATE_CHECK: "false"
  POWERPIPE_UPDATE_CHECK: "false"

jobs:
  finops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: spendlens-${{ github.run_id }}
      - name: Install Steampipe, Powerpipe and spendlens
        run: |
          sudo /bin/sh -c "$(curl -fsSL https://steampipe.io/install/steampipe.sh)"
          sudo /bin/sh -c "$(curl -fsSL https://powerpipe.io/install/powerpipe.sh)"
          pip install -q "$SPENDLENS_PACKAGE"
          steampipe plugin install aws
          steampipe service start
      - name: Restore history (cache fallback when no S3 location is set)
        if: ${{ vars.SPENDLENS_HISTORY_S3 == '' }}
        uses: actions/cache@v4
        with:
          path: .spendlens
          key: spendlens-history-${{ github.run_id }}
          restore-keys: spendlens-history-
      - name: Restore history from S3
        if: ${{ vars.SPENDLENS_HISTORY_S3 != '' }}
        run: |
          mkdir -p .spendlens
          aws s3 cp "$SPENDLENS_HISTORY_S3" "$SPENDLENS__HISTORY__PATH" || echo "no previous history yet"
      - name: Run all checks and build the report
        id: report
        run: |
          spendlens doctor || true
          spendlens report --out reports
      - name: Save history to S3
        if: ${{ always() && vars.SPENDLENS_HISTORY_S3 != '' }}
        run: aws s3 cp "$SPENDLENS__HISTORY__PATH" "$SPENDLENS_HISTORY_S3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spendlens-report
          path: reports/
          retention-days: 30
      - name: Notify
        if: always()
        env:
          SPENDLENS_SLACK_WEBHOOK: ${{ secrets.SPENDLENS_SLACK_WEBHOOK }}
          SPENDLENS_TEAMS_WEBHOOK: ${{ secrets.SPENDLENS_TEAMS_WEBHOOK }}
        run: |
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$SPENDLENS_SLACK_WEBHOOK" ]; then spendlens notify --slack --source last --link "$link"; fi
          if [ -n "$SPENDLENS_TEAMS_WEBHOOK" ]; then spendlens notify --teams --source last --link "$link"; fi
