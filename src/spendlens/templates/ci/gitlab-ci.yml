# spendlens scheduled FinOps run for GitLab CI (generated by `spendlens init --ci gitlab`).
#
# One-time setup (details: docs/ci.md):
#   1. AWS: an IAM OIDC identity provider for your GitLab URL, and a read-only role (docs/permissions.md) whose
#      trust policy allows this project. No AWS keys are stored in GitLab.
#   2. CI/CD variables: AWS_ROLE_ARN, AWS_REGION; optional SPENDLENS_HISTORY_S3 (s3://bucket/spendlens/history.db,
#      keeps trends across pipelines; falls back to the GitLab cache); masked SPENDLENS_SLACK_WEBHOOK /
#      SPENDLENS_TEAMS_WEBHOOK for notifications.
#   3. Commit your finops.yaml; add a pipeline schedule (Build > Pipeline schedules), e.g. "0 6 * * 1-5".

stages: [finops]

variables:
  SPENDLENS_PACKAGE: "spendlens[ai] @ git+https://github.com/devops-monk/spendlens.git"  # pin a tag in production
  SPENDLENS_CONFIG: "$CI_PROJECT_DIR/finops.yaml"
  SPENDLENS__HISTORY__PATH: "$CI_PROJECT_DIR/.spendlens/history.db"
  STEAMPIPE_UPDATE_CHECK: "false"
  POWERPIPE_UPDATE_CHECK: "false"

finops:
  stage: finops
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  cache:
    key: spendlens-history
    paths: [.spendlens/]
  before_script:
    # tools (as root); Steampipe refuses to run as root, so the checks run as the "finops" user below
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates git > /dev/null
    - /bin/sh -c "$(curl -fsSL https://steampipe.io/install/steampipe.sh)"
    - /bin/sh -c "$(curl -fsSL https://powerpipe.io/install/powerpipe.sh)"
    - pip install -q "$SPENDLENS_PACKAGE" awscli
    - useradd --create-home finops && mkdir -p .spendlens reports && chown -R finops "$CI_PROJECT_DIR"
    # AWS via GitLab OIDC: the SDK credential chain (Steampipe aws plugin, aws CLI) assumes AWS_ROLE_ARN
    - echo "$AWS_ID_TOKEN" > /tmp/aws-web-identity-token && chmod 644 /tmp/aws-web-identity-token
  script:
    - |
      runuser -u finops -- env AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws-web-identity-token \
        AWS_ROLE_SESSION_NAME="spendlens-$CI_PIPELINE_ID" HOME=/home/finops bash -euo pipefail -c '
        if [ -n "${SPENDLENS_HISTORY_S3:-}" ]; then
          aws s3 cp "$SPENDLENS_HISTORY_S3" "$SPENDLENS__HISTORY__PATH" || echo "no previous history yet"
        fi
        steampipe plugin install aws
        steampipe service start
        spendlens doctor || true
        status=0
        spendlens report --out reports || status=$?
        if [ -n "${SPENDLENS_HISTORY_S3:-}" ]; then aws s3 cp "$SPENDLENS__HISTORY__PATH" "$SPENDLENS_HISTORY_S3"; fi
        link="$CI_JOB_URL/artifacts/file/reports/report.html"
        [ -n "${SPENDLENS_SLACK_WEBHOOK:-}" ] && spendlens notify --slack --source last --link "$link" || true
        [ -n "${SPENDLENS_TEAMS_WEBHOOK:-}" ] && spendlens notify --teams --source last --link "$link" || true
        steampipe service stop
        exit $status
      '
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "spendlens report"
    paths: [reports/]

# Optional gate: fail the pipeline on tag-policy alarms (uses the history the finops job just wrote).
